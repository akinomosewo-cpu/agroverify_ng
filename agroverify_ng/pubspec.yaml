name: agroverify_ng
description: Agro-input verification and agro-dealer rating app for Nigerian farmers.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^8.1.4
  bloc: ^8.1.4
  equatable: ^2.0.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dartz: ^0.10.1
  intl: ^0.20.2
  uuid: ^4.3.3
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  gap: ^3.0.1
  iconsax: ^0.0.8
  mobile_scanner: ^4.0.1
  geolocator: ^11.0.0
  image_picker: ^1.0.7
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.7
  flutter_lints: ^3.0.0
flutter:
  uses-material-design: true
